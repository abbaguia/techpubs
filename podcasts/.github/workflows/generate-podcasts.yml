name: Generate Podcast Episode Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_episodes.py"

permissions:
  contents: write

jobs:
  build-episodes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run episode generator
        run: python3 scripts/generate_episodes.py

      - name: Commit generated HTML files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podcasts/
          if ! git diff --staged --quiet; then
            git commit -m "Generate podcast episode HTML pages"
            git push
          else
            echo "No changes to commit."
          fi
