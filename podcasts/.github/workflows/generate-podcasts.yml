name: Run Podcast Generation Script

on:
  workflow_dispatch: # Adds a "Run workflow" button in the GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - "scripts/**"

permissions:
  contents: write # Allows the workflow to commit and push changes back to the repo

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run script
        run: |
          python3 scripts/generate_episodes.py

      - name: Commit changes if any were produced
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Automated update from GitHub Actions"
            git push
          else
            echo "No changes to commit."
          fi
